[project]
name = "sentiment-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kasperjoergensen3", email = "Kasperjoergensen3@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "jinja2>=3.1.6",
    "joblib>=1.6.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "scikit-learn>=1.9.1",
    "sqlmodel>=0.0.50",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sentiment-app = "sentiment_app:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
